<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Meus Projetos · WhatsAppEntrega</title>
  <link rel="stylesheet" href="/workspace.css">
  <script type="module" src="/workspace.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir para o conteúdo</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Menu lateral">
      <a class="brand" href="#projects" aria-label="WhatsAppEntrega — Meus Projetos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-7l-6 3v-3a2 2 0 0 1-1-2z"/><path d="m9 10 2 2 4-4"/></svg>
        <span>WhatsApp<span>Entrega</span><small>PAINEL DE OPERAÇÕES</small></span>
      </a>
      <nav id="navigation" aria-label="Navegação principal"></nav>
      <div class="sidebar-foot">
        <button id="connection" class="connection" type="button">
          <span class="signal" aria-hidden="true"></span>
          <span>WhatsApp<small id="connection-state">Consultando conexão…</small></span>
        </button>
      </div>
    </aside>
    <div class="surface">
      <header class="topbar">
        <button id="mobile-menu" class="icon-button mobile-menu" type="button" aria-label="Alternar menu lateral" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div id="breadcrumb" class="breadcrumb">Central de projetos</div>
        <details id="switcher" class="switcher" hidden>
          <summary id="switcher-label">Selecionar projeto</summary>
          <div class="switcher-panel">
            <label class="sr-only" for="project-search">Pesquisar projetos</label>
            <input id="project-search" placeholder="Pesquisar projetos…" type="search">
            <div id="switcher-list" class="switcher-list"></div>
            <a href="#projects">Voltar aos projetos</a>
            <button id="switcher-create" type="button" class="button primary">+ Criar projeto</button>
          </div>
        </details>
      </header>
      <main id="main" tabindex="-1" aria-busy="true"><div class="skeleton" aria-label="Carregando projetos"></div></main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
